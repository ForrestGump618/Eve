version: 2
updates:
  # Python runtime / dev dependencies declared in pyproject.toml
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      python-runtime:
        patterns:
          - "*"
        exclude-patterns:
          - pytest
          - pytest-asyncio
      python-test:
        patterns:
          - pytest
          - pytest-asyncio
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # GitHub Actions used by .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
      include: scope
