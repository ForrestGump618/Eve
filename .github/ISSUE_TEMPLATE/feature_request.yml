name: "功能建议 / Feature request"
description: 描述你想解决的问题，以及你希望素问如何支持它 / Propose a problem or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提功能建议！请优先描述**问题与使用场景**，而不是只给一个方案，这样更容易讨论出合适的设计。

        如果只是想问「能不能做 X」，可以先看 [SUPPORT.md](https://github.com/ForrestGump618/suwen/blob/main/SUPPORT.md) 与已有 issue。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查 / Before submitting
      options:
        - label: 我已搜索过已有 issue 与文档，没有找到重复建议。
          required: true
        - label: 这不是一个安全漏洞报告（漏洞请走私密渠道）。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem statement
      description: 你当前遇到的具体困难是什么？在什么场景下出现？没有这个功能会带来什么代价？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你的设想 / Proposed solution
      description: 你希望素问如何支持它？可以是交互流程、命令、配置项、Agent/Skill 形式，也可以只是一个大方向。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
      description: 你试过哪些现有做法或替代方案？为什么不够用？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及领域 / Area
      options:
        - 界面与交互 / Web UI
        - Agent 与 Skill
        - 单细胞分析
        - 空间组学分析
        - 证据链与可复现性
        - SSH / 远端工作区
        - 配置与部署
        - 文档
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional context
      description: 参考实现、相关论文/工具、截图、你愿意贡献 PR 吗等。
    validations:
      required: false
