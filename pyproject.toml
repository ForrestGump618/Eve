[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omicslab"
version = "2.1.1"
description = "Suwen - local-first AI agent workspace with persistent tasks, skills, remote workspaces and scientific evidence gates."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OmicsLab contributors" }]
keywords = [
  "ai-agent",
  "agent-platform",
  "local-first",
  "llm",
  "mcp",
  "scientific-workflow",
  "bioinformatics",
  "single-cell",
  "notebook",
  "self-hosted",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jupyter_client>=8.6",
  "ipykernel>=6.29",
  "httpx>=0.27",
  "nbformat>=5.10",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "rich>=13.7",
  "prompt_toolkit>=3.0",
  "websockets>=12.0",
  "paramiko>=3.4",
  "qrcode>=8.0,<9",
]

[project.optional-dependencies]
bio = [
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "scanpy>=1.10",
  "anndata>=0.10",
]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[project.scripts]
suwen = "omicslab.cli:main"
omicslab = "omicslab.cli:main"

[project.urls]
Homepage = "https://github.com/ForrestGump618/suwen"
Repository = "https://github.com/ForrestGump618/suwen"
Issues = "https://github.com/ForrestGump618/suwen/issues"
Documentation = "https://github.com/ForrestGump618/suwen/blob/main/docs/README.md"
Changelog = "https://github.com/ForrestGump618/suwen/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["omicslab*"]

[tool.setuptools.package-data]
omicslab = ["web/**/*", "skills/**/*", "agents/**/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
