[build-system]
requires = ["setuptools>=84.2.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omicslab"
version = "2.0.0"
description = "Suwen - local-first AI agent workspace with persistent tasks, skills, remote workspaces and scientific evidence gates."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OmicsLab contributors" }]
keywords = [
  "ai-agent",
  "agent-platform",
  "local-first",
  "llm",
  "mcp",
  "scientific-workflow",
  "bioinformatics",
  "single-cell",
  "notebook",
  "self-hosted",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = [
  "fastapi>=0.155.0",
  "uvicorn[standard]>=0.54.0",
  "jupyter_client>=8.10.0",
  "ipykernel>=7.3.0",
  "httpx>=0.28.1",
  "nbformat>=5.11.1",
  "python-multipart>=0.0.32",
  "pyyaml>=6.0.3",
  "rich>=15.0.0",
  "prompt_toolkit>=3.0.53",
  "websockets>=16.1.1",
  "paramiko>=5.1.0",
]

[project.optional-dependencies]
bio = [
  "numpy>=2.2.6",
  "pandas>=2.3.3",
  "matplotlib>=3.10.9",
  "scanpy>=1.11.5",
  "anndata>=0.11.4",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
suwen = "omicslab.cli:main"
omicslab = "omicslab.cli:main"

[project.urls]
Homepage = "https://github.com/ForrestGump618/suwen"
Repository = "https://github.com/ForrestGump618/suwen"
Issues = "https://github.com/ForrestGump618/suwen/issues"
Documentation = "https://github.com/ForrestGump618/suwen/blob/main/docs/README.md"
Changelog = "https://github.com/ForrestGump618/suwen/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["omicslab*"]

[tool.setuptools.package-data]
omicslab = ["web/**/*", "skills/**/*", "agents/**/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
