[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omicslab"
version = "2.0.0"
description = "Suwen - extensible AI agent platform with persistent tasks, remote workspaces and scientific evidence gates."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OmicsLab contributors" }]
keywords = ["bioinformatics", "single-cell", "spatial-omics", "agent", "llm", "notebook"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jupyter_client>=8.6",
  "ipykernel>=6.29",
  "httpx>=0.27",
  "nbformat>=5.10",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "rich>=13.7",
  "prompt_toolkit>=3.0",
  "websockets>=12.0",
  "paramiko>=3.4",
]

[project.optional-dependencies]
bio = [
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "scanpy>=1.10",
  "anndata>=0.10",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
suwen = "omicslab.cli:main"
omicslab = "omicslab.cli:main"

[project.urls]
Homepage = "https://github.com/ForrestGump618/suwen"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["omicslab*"]

[tool.setuptools.package-data]
omicslab = ["web/**/*", "skills/**/*", "agents/**/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
